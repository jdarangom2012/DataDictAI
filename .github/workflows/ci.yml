name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datadictai_test
          POSTGRES_USER: datadictai
          POSTGRES_PASSWORD: datadictai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datadictai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      FERNET_KEY: ${{ secrets.CI_FERNET_KEY }}
      DATABASE_URL: postgres://datadictai:datadictai@localhost:5432/datadictai_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: "True"
      # El target de los tests de introspeccion es el propio Postgres de CI (localhost).
      ALLOW_PRIVATE_DB_HOSTS: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements/dev.txt
      - name: Generate ephemeral FERNET_KEY if not set
        run: |
          if [ -z "$FERNET_KEY" ]; then
            echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
          fi
      - run: python manage.py migrate --noinput
      - run: pytest
